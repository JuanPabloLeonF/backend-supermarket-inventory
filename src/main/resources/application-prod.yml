spring:
    # DATABASE
    datasource:
        url: ${DB_URL}
        driver-class-name: ${DRIVER_CLASS_NAME}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}

    # JPA
    jpa:
        database-platform: ${DATABASE_PLATFORM}
        show-sql: false
        hibernate:
            ddl-auto: validate
        open-in-view: false
        properties:
            hibernate:
                format_sql: true

# APPLICATION
app:
    path-upload-images-products: ${UPLOAD_PATH_EMPLOYEE}